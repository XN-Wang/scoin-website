<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoin | Trusted Stablecoin Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .bg-scoin-dark { background-color: #001A3D; }
        .text-scoin-primary { color: #0047AB; }
        .border-scoin-soft { border-color: rgba(0, 0, 0, 0.05); }
        .transition-standard { transition: all 0.3s ease-in-out; }

        .hero-gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Institutional Dark Background & Animations */
        .fintech-bg-gradient {
            background: linear-gradient(135deg, #0B0F1A 0%, #111827 40%, #1C2541 100%);
        }

        .noise-overlay {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3%3Ffilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.035;
            pointer-events: none;
        }

        @keyframes drift-azure {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5%, 10%) scale(1.1); }
            66% { transform: translate(-5%, 5%) scale(0.95); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes drift-purple {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-8%, -5%) scale(0.9); }
            66% { transform: translate(5%, -10%) scale(1.05); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .animate-drift-azure {
            animation: drift-azure 18s ease-in-out infinite;
            will-change: transform;
        }

        .animate-drift-purple {
            animation: drift-purple 22s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes marquee-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes marquee-right {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        .animate-marquee-left {
            display: flex;
            width: max-content;
            animation: marquee-left var(--duration) linear infinite;
        }

        .animate-marquee-right {
            display: flex;
            width: max-content;
            animation: marquee-right var(--duration) linear infinite;
        }

        .pause-on-hover:hover .animate-marquee-left,
        .pause-on-hover:hover .animate-marquee-right {
            animation-play-state: paused;
        }

        @keyframes float-hk {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }
        @keyframes float-us {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.02); }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes spin-slow-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        
        .animate-coin-hk { animation: float-hk 4s ease-in-out infinite; }
        .animate-coin-us { animation: float-us 4.5s ease-in-out infinite; }
        .animate-spin-slow { animation: spin-slow 20s linear infinite; }
        .animate-spin-slow-reverse { animation: spin-slow-reverse 25s linear infinite; }

        .stagger-in > * {
            opacity: 0;
            transform: translateY(30px);
            animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes reveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal-item {
            opacity: 0;
            transform: translateY(40px);
            filter: blur(8px);
            transition: opacity 1.2s cubic-bezier(0.2, 1, 0.3, 1), 
                        transform 1.2s cubic-bezier(0.2, 1, 0.3, 1), 
                        filter 1.2s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .reveal-item.visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        /* ScoinHK: 70% viewport gradient glass (top to bottom) */
        .hero-glass-70 {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 70vh;
            background: linear-gradient(to bottom, rgba(0, 29, 74, 0.92) 0%, rgba(0, 29, 74, 0.4) 50%, transparent 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            pointer-events: none;
        }
    </style>
<script type="importmap">
{

  }
}
</script>

</head>

</html>
